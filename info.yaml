
# Tiny Tapeout project information
project:
  title: "Tiny Dataflow Inference Processor"
  author: "Petar Vukasinovic"
  discord: ""
  description: "Programmable 4-PE INT4 inference accelerator with configurable dataflow routing and a host-loaded instruction set"
  language: "SystemVerilog"
  clock_hz: 10000000

  # Initial footprint for physical-design exploration.
  # Increase after reviewing placement and routing results.
  tiles: "1x1"

  # Must match the module declaration in tt_um_dataflow.sv
  top_module: "tt_um_dataflow"

  source_files:
    - "tt_um_dataflow.sv"
    - "host_if.sv"
    - "instruction_memory.sv"
    - "operand_buffer.sv"
    - "sequencer.sv"
    - "fabric.sv"
    - "pe.sv"

pinout:
  # Dedicated input pins: shared 8-bit address/data bus
  ui[0]: "HOST_D0"
  ui[1]: "HOST_D1"
  ui[2]: "HOST_D2"
  ui[3]: "HOST_D3"
  ui[4]: "HOST_D4"
  ui[5]: "HOST_D5"
  ui[6]: "HOST_D6"
  ui[7]: "HOST_D7"

  # Dedicated output pins: 8-bit read-data bus
  uo[0]: "READ_D0"
  uo[1]: "READ_D1"
  uo[2]: "READ_D2"
  uo[3]: "READ_D3"
  uo[4]: "READ_D4"
  uo[5]: "READ_D5"
  uo[6]: "READ_D6"
  uo[7]: "READ_D7"

  # Bidirectional GPIO: host controls bits 0-3
  uio[0]: "REQ"
  uio[1]: "WR"
  uio[2]: "ADDR"
  uio[3]: "HI"

  # Bidirectional GPIO: chip drives bits 4-7
  uio[4]: "READY"
  uio[5]: "BUSY"
  uio[6]: "DONE"
  uio[7]: "FAULT"

# Do not change!
yaml_version: 6
